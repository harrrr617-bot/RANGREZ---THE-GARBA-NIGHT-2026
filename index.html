<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rangrez - The Garba Night 2K26</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.75)),
    url("https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&w=1600&q=80")
    center/cover fixed;
}

.container{
  max-width:650px;
  margin:auto;
  padding:25px 18px;
}

.hero{
  text-align:center;
  padding:45px 10px 30px;
}

.hero h1{
  font-size:38px;
  margin:0 0 14px;
  line-height:1.15;
}

.presented{
  font-size:16px;
  margin:8px 0;
}

.tagline{
  font-size:20px;
  font-style:italic;
  margin-top:18px;
}

.event{
  background:rgba(0,0,0,.72);
  border-radius:18px;
  padding:25px;
  margin-bottom:22px;
  text-align:center;
}

.event div{
  margin:14px 0;
  font-size:17px;
}

.booking{
  background:rgba(255,255,255,.96);
  color:#222;
  padding:25px;
  border-radius:18px;
}

.booking h2{
  text-align:center;
}

label{
  display:block;
  margin:15px 0 6px;
  font-weight:bold;
}

input,
select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.price{
  text-align:center;
  font-size:26px;
  font-weight:bold;
  margin:22px 0;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#e08b25;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.helpline{
  text-align:center;
  margin:25px 0 10px;
  line-height:2;
  font-size:16px;
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">

    <h1>Rangrez - The Garba Night 2K26</h1>

    <div class="presented">
      Presented by <b>Student Council Members</b>
    </div>

    <div class="tagline">
      Feel the Beat • Live the Colours
    </div>

  </div>


  <div class="event">

    <div>📅 <b>14 October 2026</b></div>

    <div>⏰ <b>5:30 PM onwards</b></div>

    <div>📍 <b>Shree Devi College, Kenjar</b></div>

    <div>🎟️ <b>Ticket: ₹399</b></div>

  </div>


  <div class="booking">

    <h2>🎟️ Book Your Ticket</h2>

    <form id="bookingForm">

      <label for="name">Full Name</label>

      <input
        id="name"
        type="text"
        placeholder="Enter your name"
        required
      >


      <label for="phone">Mobile Number</label>

      <input
        id="phone"
        type="tel"
        maxlength="10"
        inputmode="numeric"
        placeholder="10-digit mobile number"
        required
      >


      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        required
      >


      <label for="quantity">Number of Tickets</label>

      <select id="quantity">

        <option value="1">1 Ticket</option>
        <option value="2">2 Tickets</option>
        <option value="3">3 Tickets</option>
        <option value="4">4 Tickets</option>
        <option value="5">5 Tickets</option>

      </select>


      <div class="price" id="total">
        ₹399
      </div>


      <button type="submit">
        Continue to Payment
      </button>

    </form>

  </div>


  <div class="helpline">

    📞 <b>+91 99013 89490</b><br>

    📞 <b>+91 84315 29176</b>

  </div>

</div>


<script>

const quantity = document.getElementById("quantity");
const total = document.getElementById("total");

quantity.addEventListener("change", function(){

  total.textContent = "₹" + (399 * Number(this.value));

});


document
.getElementById("bookingForm")
.addEventListener("submit", function(e){

  e.preventDefault();

  const phone =
    document.getElementById("phone").value.trim();

  if(!/^[0-9]{10}$/.test(phone)){

    alert("Please enter a valid 10-digit mobile number");

    return;

  }

  alert(
    "Booking details accepted. Payment will be connected next."
  );

});

</script>

</body>
</html>
